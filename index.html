document.addEventListener("keydown",function(e){if(!(e.ctrlKey||e.metaKey)||e.altKey)return;var t=e.target,tn=(t&&t.tagName)||"";if(/INPUT|TEXTAREA|SELECT/.test(tn)||(t&&t.isContentEditable)||$("#edm"))return;var k=(e.key||"").toLowerCase();if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}});

  if(!SRV){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dHook();return}

  })}).catch(function(){toast("সেভ হয়নি! সার্ভার চালু আছে কিনা দেখুন")})}
function $(s){return document.querySelector(s)}

/* ---------- Dashboard ---------- */
var rN=5;
var selR={};

   '<div class="card stat"><div class="l">MCQ টেস্টে এসেছে</div><div class="n">'+bn(tested)+' <small>('+bn(pct(tested,total))+'%)</small></div><small>মোট '+bn(total)+' এর মধ্যে</small></div>'+

   '<div><label class="f">কতগুলো প্রশ্ন? (সর্বোচ্চ '+bn(n)+')</label><input type="number" id="cnt" min="1" max="'+n+'" value="'+Math.min(10,n)+'"></div>'+
   '<div><label class="f">প্রশ্নের ধরন</label><select id="dir"><option value="w2m">আরবি → বাংলা (আরবি শব্দ দেখে অর্থ বাছাই)</option><option value="m2w">বাংলা → আরবি (অর্থ দেখে আরবি শব্দ বাছাই)</option><option value="mix">র‍্যান্ডম (দুটোই মিশিয়ে)</option></select></div>'+
   '<label class="chk"><input type="checkbox" id="onlyNew"'+(rem?"":" disabled")+'> শুধু যেসব শব্দের MCQ এখনও দেওয়া হয়নি ('+bn(rem)+'টি)</label>'+
   '<div class="rsb"><div>এ পর্যন্ত টেস্টে এসেছে: <b>'+bn(n-rem)+' / '+bn(n)+'</b> টি শব্দ'+(S.covFrom?' <small>(শেষ রিসেটের পর থেকে)</small>':'')+'</div><div class="row" style="margin-top:8px"><button class="btn gh sm" onclick="resetCov()"'+(n-rem?"":" disabled")+'>↺ টেস্টের অবস্থা রিসেট করুন</button><button class="btn dg sm" onclick="resetAll()"'+(S.results.length?"":" disabled")+'>সব ফলাফল মুছুন</button></div><div class="nt">রিসেট করলে সব শব্দ আবার "এখনও MCQ দেওয়া হয়নি" হয়ে যাবে; আগের ফলাফল ও চার্ট থাকবে। "সব ফলাফল মুছুন" ফলাফলও মুছে দেয়।</div></div>'+
   '<div><button class="btn" onclick="startQuiz()">টেস্ট শুরু করুন</button></div></div></div>';
}
function startQuiz(){
  var cnt=parseInt($("#cnt").value)||1,dir=$("#dir").value,only=$("#onlyNew").checked,ts=testedSet();
  var pool=S.words.filter(function(w){return !only||!ts[w.id]});if(!pool.length)pool=S.words;
  cnt=Math.max(1,Math.min(cnt,pool.length));
  var qs=shuf(pool).slice(0,cnt).map(function(w){
    var d=dir==="mix"?(Math.random()<.5?"w2m":"m2w"):dir,f=d==="w2m"?"m":"w",q=d==="w2m"?"w":"m";
    var wr=shuf(S.words.filter(function(x){return x.id!==w.id&&x[f]!==w[f]})),seen={},dis=[];
    var om={};om[w[f]]=w.id;wr.forEach(function(x){if(dis.length<3&&!seen[x[f]]){seen[x[f]]=1;dis.push(x[f]);om[x[f]]=x.id}});
    return{id:w.id,prompt:w[q],ans:w[f],opts:shuf(dis.concat([w[f]])),sel:null,d:d,om:om};
  });
  quiz={qs:qs,done:false,res:null};render();
}
function cpOf(q,t){var id=q.om&&q.om[t],w=id&&gw(id);if(!w)return "";return q.d==="w2m"?w.w:w.m}
function cpTag(q,t){var c=cpOf(q,t);if(!c)return "";return '<span class="oc'+(q.d==="w2m"?" ar":"")+'"><small>'+(q.d==="w2m"?"আরবি":"অর্থ")+'</small><bdi>'+esc(c)+'</bdi></span>'}
function quizView(){
  var done=quiz.done,h='';
  if(done){var c=quiz.res.correct,t=quiz.qs.length,p=pct(c,t);
    h+='<div class="card hero" style="margin-bottom:16px"><div style="color:var(--mu)">আপনার ফলাফল</div><div class="big">'+bn(p)+'%</div><div>'+bn(t)+'টির মধ্যে <b style="color:var(--ok)">'+bn(c)+'টি সঠিক</b>, <b style="color:var(--bad)">'+bn(t-c)+'টি ভুল</b></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="quiz=null;render()">নতুন টেস্ট</button><button class="btn gh" onclick="quiz=null;go(\'dash\')">ড্যাশবোর্ডে যান</button></div></div>';}
  h+='<div style="max-width:680px;margin:auto">'+quiz.qs.map(function(q,i){
    var s='<div class="card q"><div class="t"><span class="qn">'+bn(i+1)+'/'+bn(quiz.qs.length)+'</span><span>'+(q.d==="w2m"?"আরবি → অর্থ বাছাই করুন":"অর্থ → আরবি বাছাই করুন")+'</span></div><div class="w" dir="auto">'+esc(q.prompt)+'</div>';
    q.opts.forEach(function(o,j){var cl="opt",ic="✓";
      if(done){if(o===q.ans){cl+=" ok"}else if(o===q.sel){cl+=" no";ic="✕"}}else if(o===q.sel)cl+=" sel";
      s+='<label class="'+cl+'"><input type="radio" name="q'+i+'" '+(o===q.sel?"checked":"")+(done?" disabled":"")+' onchange="pick('+i+','+j+')"><span class="tick">'+ic+'</span><span dir="auto">'+esc(o)+'</span>'+(done?cpTag(q,o):'')+'</label>'});
    if(done&&q.sel!==q.ans){var lb=q.d==="w2m"?"আরবি":"অর্থ",ca=cpOf(q,q.ans),cs=q.sel!==null?cpOf(q,q.sel):"";
      s+='<div class="ans">'+(q.sel===null?"উত্তর দেওয়া হয়নি। ":"ভুল উত্তর। ")+'সঠিক উত্তর: <bdi dir="auto">'+esc(q.ans)+'</bdi>'+(ca?' <span class="cpn">('+lb+': <bdi>'+esc(ca)+'</bdi>)</span>':'')+'</div>';
      if(q.sel!==null)s+='<div class="ans bad">আপনার বাছাই: <bdi dir="auto">'+esc(q.sel)+'</bdi>'+(cs?' <span class="cpn">('+lb+': <bdi>'+esc(cs)+'</bdi>)</span> — এটি অন্য শব্দের '+(q.d==="w2m"?"অর্থ":"আরবি")+'':'')+'</div>'}
    if(done){var ww=gw(q.id);if(ww)s+='<div class="rv"><b><bdi>'+esc(ww.w)+'</bdi></b> — <bdi>'+esc(ww.m)+'</bdi>'+chips(ww)+(ww.note?'<div class="nt">'+esc(ww.note)+'</div>':'')+'</div>'}
    return s+'</div>'}).join("");
  if(!done){var a=quiz.qs.filter(function(q){return q.sel!==null}).length;
    h+='<div class="card row sp" style="position:sticky;bottom:12px"><span>'+bn(a)+' / '+bn(quiz.qs.length)+' উত্তর দেওয়া হয়েছে</span><span class="row"><button class="btn gh" onclick="if(confirm(\'টেস্ট বাতিল করবেন?\')){quiz=null;render()}">বাতিল</button><button class="btn" onclick="submitQuiz()">সাবমিট করুন</button></span></div>'}
  return h+'</div>';
}
function pick(i,j){quiz.qs[i].sel=quiz.qs[i].opts[j];var a=quiz.qs.filter(function(q){return q.sel!==null}).length;
  document.querySelectorAll('input[name="q'+i+'"]').forEach(function(e,k){e.parentNode.classList.toggle("sel",k===j)});
  var b=document.querySelector(".card.row.sp span");if(b)b.textContent=bn(a)+" / "+bn(quiz.qs.length)+" উত্তর দেওয়া হয়েছে"}
function submitQuiz(){
  var un=quiz.qs.filter(function(q){return q.sel===null}).length;
  if(un&&!confirm(bn(un)+"টি প্রশ্নের উত্তর দেওয়া হয়নি। এগুলো ভুল ধরে সাবমিট করবেন?"))return;
  var c=quiz.qs.filter(function(q){return q.sel===q.ans}).length,now=new Date();
  S.results.push({id:uid(),at:now.toISOString(),day:dayKey(now),total:quiz.qs.length,correct:c,ids:quiz.qs.map(function(q){return q.id})});
  save();quiz.done=true;quiz.res={correct:c};render();
}

/* ===== Dropbox অটো-সিঙ্ক (সার্ভার ছাড়া) ===== */
var DK="vocab_dbx_v1",DF="/vocab-data.json",D=(function(){try{return JSON.parse(localStorage.getItem(DK))||{}}catch(e){return{}}})(),dSt={busy:0,msg:""},dT=null;
function dSave(){try{localStorage.setItem(DK,JSON.stringify(D))}catch(e){}}
function dRedirect(){return location.origin+location.pathname}
function b64u(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dShow(m){dSt.msg=m;var e=$("#dstat");if(e)e.textContent=m}
function dPack(){return{version:1,updated:new Date().toISOString(),data:S}}
function dHook(){D.dirty=1;dSave();if(D.rt){clearTimeout(dT);dT=setTimeout(function(){dSync()},2500);dShow("সিঙ্কের অপেক্ষায়…")}}
async function dConnect(){
  var key=($("#dkey").value||"").trim();if(!key){toast("আগে Dropbox অ্যাপ কী দিন");return}
  D.key=key;dSave();
  var v=b64u(crypto.getRandomValues(new Uint8Array(48))),ch=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  localStorage.setItem("dpk",v);
  location.href="https://www.dropbox.com/oauth2/authorize?"+new URLSearchParams({client_id:key,response_type:"code",code_challenge:ch,code_challenge_method:"S256",token_access_type:"offline",redirect_uri:dRedirect()})}
async function dTok(b){var r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(b)}),j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||"টোকেন ত্রুটি");return j}
async function dAuth(){
  if(D.at&&Date.now()<D.exp-60000)return D.at;
  if(!D.rt)throw new Error("Dropbox লগইন নেই");
  var j=await dTok({grant_type:"refresh_token",refresh_token:D.rt,client_id:D.key});
  D.at=j.access_token;D.exp=Date.now()+j.expires_in*1000;dSave();return D.at}
async function dCallback(){
  var p=new URLSearchParams(location.search),c=p.get("code"),v=localStorage.getItem("dpk");
  if(!c||!v||!D.key)return false;
  history.replaceState(null,"",location.pathname);localStorage.removeItem("dpk");
  try{var j=await dTok({grant_type:"authorization_code",code:c,code_verifier:v,client_id:D.key,redirect_uri:dRedirect()});
    D.rt=j.refresh_token;D.at=j.access_token;D.exp=Date.now()+j.expires_in*1000;D.rev=null;dSave();toast("Dropbox যুক্ত হয়েছে");render();return true}
  catch(e){toast("লগইন হয়নি: "+e.message);return false}}
function dHdr(tk,arg,ct){var o={Authorization:"Bearer "+tk};if(arg)o["Dropbox-API-Arg"]=JSON.stringify(arg);if(ct)o["Content-Type"]=ct;return o}
async function dMeta(tk,path){
  var r=await fetch("https://api.dropboxapi.com/2/files/get_metadata",{method:"POST",headers:dHdr(tk,0,"application/json"),body:JSON.stringify({path:path||DF})});
  if(r.status===409)return null;if(!r.ok)throw new Error("Dropbox ত্রুটি "+r.status);return r.json()}
async function dDown(tk){
  var r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:dHdr(tk,{path:DF})});
  if(!r.ok)throw new Error("ডাউনলোড ত্রুটি "+r.status);
  var rev=null;try{rev=JSON.parse(r.headers.get("dropbox-api-result")).rev}catch(e){}
  var o=JSON.parse(await r.text());if(!rev){var m=await dMeta(tk);rev=m&&m.rev}
  return{obj:o,rev:rev}}
async function dUp(tk,mode,path){
  var r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:dHdr(tk,{path:path||DF,mode:mode,mute:true},"application/octet-stream"),body:JSON.stringify(dPack())});
  if(!r.ok)throw new Error("আপলোড ত্রুটি "+r.status);return r.json()}
function dValid(o){return o&&o.data&&Array.isArray(o.data.words)&&Array.isArray(o.data.results)}
function dApply(o,rev){
  S=o.data;norm();mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  D.rev=rev;D.dirty=0;dSave();uS=[];rS=[];uBase=snapS();applyFonts();render();ubtn()}
async function dPush(tk,m){
  if(m){await dUp(tk,{".tag":"update",update:m.rev},"/backups/vocab-"+new Date().toISOString().replace(/[:.]/g,"-")+".json").catch(function(){})}
  var r=await dUp(tk,m?{".tag":"update",update:m.rev}:{".tag":"add"});
  if(r.path_lower!==DF)throw new Error("কনফ্লিক্ট কপি তৈরি হয়েছে (Dropbox দেখুন)");
  D.rev=r.rev;D.dirty=0;dSave()}
async function dSync(manual){
  if(SRV||!D.rt||dSt.busy)return;
  if(quiz&&!quiz.done&&!manual){dShow("টেস্ট চলছে, পরে সিঙ্ক হবে");return}
  dSt.busy=1;dShow("সিঙ্ক হচ্ছে…");
  try{
    var tk=await dAuth(),m=await dMeta(tk),t=new Date().toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit"});
    if(!m){await dPush(tk,null);dShow("✓ Dropbox-এ সেভ হয়েছে ("+t+")")}
    else if(m.rev===D.rev){
      if(D.dirty){await dPush(tk,m);dShow("✓ সেভ হয়েছে ("+t+")")}else dShow("✓ আপ টু ডেট ("+t+")")}
    else{
      var empty=!S.words.length&&!S.results.length,pull=false;
      if(D.rev&&!D.dirty||empty)pull=true;
      else pull=confirm("Dropbox-এ ভিন্ন ডেটা আছে।\n\nOK = Dropbox-এর ডেটা নিন (এই ডিভাইসের ডেটা বদলে যাবে)\nCancel = এই ডিভাইসের ডেটা দিয়ে Dropbox প্রতিস্থাপন (আগেরটা backups ফোল্ডারে থাকবে)");
      if(pull){var d=await dDown(tk);if(!dValid(d.obj))throw new Error("Dropbox-এর ফাইল ঠিক নয়");dApply(d.obj,d.rev);dShow("✓ Dropbox থেকে নামানো হয়েছে ("+t+")")}
      else{await dPush(tk,m);dShow("✓ Dropbox প্রতিস্থাপিত ("+t+")")}}
  await dDaily(tk);
  }catch(e){dShow("⚠ সিঙ্ক হয়নি: "+e.message+" (পরে আবার চেষ্টা হবে)")}
  finally{dSt.busy=0}}
async function dDaily(tk){var k=dayKey();if(D.bk===k||D.dirty)return;try{await dUp(tk,{".tag":"overwrite"},"/backups/daily-"+k+".json");D.bk=k;dSave()}catch(e){}}
function dOut(){if(!confirm("এই ডিভাইস থেকে Dropbox লগআউট হবে (ডেটা থাকবে)। চালিয়ে যাবেন?"))return;D={key:D.key};dSave();render()}
function dExp(){var b=new Blob([JSON.stringify(dPack())],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="vocab_backup_"+dayKey()+".json";document.body.appendChild(a);a.click();a.remove()}
function dImp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{
  var j=JSON.parse(r.result);if(j&&j.data&&typeof j.data==="object"&&!Array.isArray(j.data)&&"version" in j)j=j.data;
  if(!j||!Array.isArray(j.words)||!Array.isArray(j.results)){alert("এটি এই অ্যাপের ব্যাকআপ ফাইল নয়");return}
  if(!confirm("এই ডিভাইসের বর্তমান ডেটা এই ফাইলের ডেটা দিয়ে প্রতিস্থাপিত হবে। চালিয়ে যাবেন?"))return;
  S=j;norm();save();render();toast("ব্যাকআপ ফেরানো হয়েছে")}catch(e){alert("ফাইল পড়া যায়নি")}};r.readAsText(f);el.value=""}
var RO=false;try{RO=localStorage.getItem("vocab_ro")==="1"}catch(e){}
function roT(){RO=!RO;try{localStorage.setItem("vocab_ro",RO?"1":"0")}catch(e){}tab="dash";render()}
function dCard(){
  var inp='width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;font:inherit;box-sizing:border-box',x='<details class="dd2"><summary>☁ Dropbox সিঙ্ক ও ব্যাকআপ'+(D.rt?' <small id="dstat" style="font-weight:400;color:var(--mu)">'+esc(dSt.msg||(D.dirty?"সিঙ্কের অপেক্ষায়…":"✓ যুক্ত আছে"))+'</small>':'')+'</summary><div class="card">';
  if(!D.rt)x+='<p style="color:var(--mu);margin:0 0 10px">একবার যুক্ত করলে সব ডিভাইসে ডেটা নিজে নিজে সিঙ্ক হবে। (এখন ডেটা শুধু এই ব্রাউজারে আছে।)</p><p style="margin:0 0 6px;font-size:13px">Dropbox অ্যাপে <b>Redirect URI</b> হিসেবে এটি দিন:</p><input readonly value="'+esc(dRedirect())+'" onclick="this.select()" style="'+inp+';margin-bottom:10px"><input id="dkey" placeholder="Dropbox অ্যাপ কী (App key)" value="'+esc(D.key||"")+'" style="'+inp+';margin-bottom:10px"><div class="row"><button class="btn sm" onclick="dConnect()">Dropbox-এ যুক্ত করুন</button></div>';
  else x+='<div class="row"><button class="btn sm" onclick="dSync(1)">↻ এখনই সিঙ্ক</button><button class="btn gh sm" onclick="dOut()">লগআউট</button></div>';
  x+='<div class="row" style="margin-top:12px"><button class="btn gh sm" onclick="dExp()">⬇ ব্যাকআপ ফাইল</button><label class="btn gh sm" style="margin:0">⬆ ব্যাকআপ ফেরান<input type="file" accept=".json" onchange="dImp(this)" style="display:none"></label><button class="btn gh sm" onclick="roT()">'+(RO?"✎ এডিট মোড চালু করুন":"📱 শুধু টেস্ট মোড")+'</button></div></div></details>';
  return x}
async function dInit(){
  if(SRV)return;
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
  await dCallback();
  if(D.rt)dSync();
  document.addEventListener("visibilitychange",function(){if(!D.rt)return;if(document.hidden){if(D.dirty){clearTimeout(dT);dSync()}}else dSync()});
  addEventListener("online",function(){if(D.rt)dSync()})}
load();norm();uBase=snapS();applyFonts();render();ubtn();dInit();
</script>
